<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT X3 · Truyền Thông Sáng Tạo · Bộ Học Liệu Tổng Hợp</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2B5B;--blue:#1B4FD8;--blue-light:#3B70F2;
  --sky:#E8EFFF;--sky-deep:#D0DEFF;
  --amber:#F59E0B;--amber-light:#FEF3C7;
  --green:#059669;--green-light:#D1FAE5;
  --red:#DC2626;--red-light:#FEE2E2;
  --slate:#64748B;--slate-light:#F1F5F9;
  --ink:#1E293B;--ink-soft:#475569;
  --border:#CBD5E1;--radius:10px;--radius-sm:6px;
  --shadow:0 2px 8px rgba(15,43,91,.10);
  --shadow-md:0 4px 20px rgba(15,43,91,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Be Vietnam Pro",sans-serif;background:#F0F4FF;color:var(--ink);font-size:15px;line-height:1.65;min-height:100vh}

/* HEADER */
.site-header{background:linear-gradient(135deg,var(--navy) 0%,#1B3A7A 60%,#1B4FD8 100%);color:#fff;padding:20px 32px 16px;position:relative;overflow:hidden}
.site-header::before{content:"X3";position:absolute;right:-16px;top:-16px;font-size:140px;font-weight:700;opacity:.06;letter-spacing:-8px;line-height:1;font-family:"JetBrains Mono",monospace}
.header-eyebrow{font-size:11px;font-weight:600;letter-spacing:2px;color:#93B4FF;text-transform:uppercase;margin-bottom:4px}
.header-title{font-size:22px;font-weight:700;line-height:1.2;margin-bottom:2px}
.header-subtitle{font-size:12px;color:#A5C0FF}

/* ACTION BAR */
.action-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .18s;font-family:inherit;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-reset{background:var(--red-light);color:var(--red);border-color:#FECACA}.btn-reset:hover:not(:disabled){background:#FEE2E2;border-color:var(--red)}
.btn-print{background:var(--slate-light);color:var(--ink);border-color:var(--border)}.btn-print:hover{background:#E2E8F0}
.btn-email{background:var(--amber-light);color:#92400E;border-color:#FDE68A}.btn-email:hover:not(:disabled){background:#FEF3C7;border-color:var(--amber)}
.btn-save{background:var(--green-light);color:#065F46;border-color:#6EE7B7}.btn-save:hover:not(:disabled){background:#A7F3D0;border-color:var(--green)}
.btn-submit{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-submit:hover:not(:disabled){background:#1440B0}
.btn-icon{font-size:15px}

/* STUDENT BAR */
.student-bar{background:#fff;border-bottom:2px solid var(--sky-deep);padding:12px 32px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}
.student-field{display:flex;flex-direction:column;gap:4px}
.student-field label{font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.8px}
.student-field select,.student-field input{padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--ink);background:var(--slate-light);transition:border-color .15s}
.student-field select:focus,.student-field input:focus{outline:none;border-color:var(--blue);background:#fff}
#loadStatus{font-size:12px;color:var(--slate);padding:4px 0;align-self:flex-end}

/* LESSON TABS (Row 1) */
.lesson-tabs-wrap{background:#fff;border-bottom:1px solid var(--sky-deep);padding:0 32px;overflow-x:auto;position:sticky;top:53px;z-index:90}
.lesson-tabs{display:flex;gap:2px;padding:8px 0 0;min-width:max-content}
.lesson-tab{padding:8px 14px;font-size:13px;font-weight:600;color:var(--slate);background:transparent;border:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;transition:all .15s;white-space:nowrap;border-bottom:3px solid transparent;font-family:inherit}
.lesson-tab:hover{color:var(--blue);background:var(--sky)}
.lesson-tab.active{color:var(--blue);background:var(--sky);border-bottom-color:var(--blue)}

/* HL TABS (Row 2) */
.hl-tabs-wrap{background:var(--sky);border-bottom:2px solid var(--sky-deep);padding:8px 32px;display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:101px;z-index:89}
.hl-tab{padding:6px 14px;font-size:12px;font-weight:600;color:var(--ink-soft);background:#fff;border:1.5px solid var(--border);border-radius:20px;cursor:pointer;transition:all .15s;font-family:inherit;display:flex;align-items:center;gap:6px}
.hl-tab:hover{background:var(--sky);border-color:var(--blue-light);color:var(--blue)}
.hl-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.hl-tab .status-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.hl-tab.draft .status-dot{background:var(--amber)}
.hl-tab.submitted .status-dot{background:var(--green)}

/* HL PANEL HEADER */
.hl-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid var(--sky-deep)}
.hl-panel-title-wrap{display:flex;align-items:flex-start;gap:14px}
.hl-badge{background:var(--blue);color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;padding:5px 10px;border-radius:var(--radius-sm);white-space:nowrap;margin-top:2px;font-family:"JetBrains Mono",monospace}
.hl-panel-actions{display:flex;gap:8px;align-items:center}
.hl-status-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.5px}
.hl-status-badge.draft{background:var(--amber-light);color:#92400E}
.hl-status-badge.submitted{background:var(--green-light);color:#065F46}
.hl-status-badge.unsaved{background:var(--slate-light);color:var(--slate)}

/* CONTENT */
.content-area{padding:24px 32px;max-width:1100px;margin:0 auto}
.hl-panel{display:none}
.hl-panel.active{display:block}

/* LOCKED OVERLAY */
.hl-panel.locked textarea,.hl-panel.locked input[type="text"],.hl-panel.locked select:not(#s_name):not(#s_lop):not(#s_nhom){background:#F8FAFC!important;color:var(--ink-soft)!important;pointer-events:none;border-color:#E2E8F0!important;cursor:not-allowed}
.hl-panel.locked input[type="checkbox"],.hl-panel.locked input[type="radio"]{pointer-events:none;opacity:.65}
.locked-banner{background:var(--green-light);border:1px solid #6EE7B7;border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;color:#065F46;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
/* STATUS extras */
.hl-tab.graded .status-dot{background:#7C3AED}
.hl-status-badge.graded{background:#EDE9FE;color:#4C1D95}
/* GRADING SECTION */
.grading-section{margin-top:20px;border:1.5px solid #DDD6FE;border-radius:var(--radius);overflow:hidden}
.grading-header{background:#4C1D95;color:#fff;padding:10px 18px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.grading-body{padding:16px 18px;background:#FAFCFF;display:flex;flex-direction:column;gap:12px}
.grading-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grade-input{width:90px;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:16px;font-weight:700;color:var(--navy);text-align:center;background:#fff}
.grade-input:focus{outline:none;border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.grade-input[readonly]{background:var(--slate-light);color:var(--ink-soft);cursor:not-allowed}
.btn-grade{background:#4C1D95;color:#fff;border-color:#4C1D95;padding:8px 18px;font-size:13px;font-weight:600;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;border-style:solid;transition:background .15s}
.btn-grade:hover:not(:disabled){background:#3B0764}
.btn-grade:disabled{opacity:.4;cursor:not-allowed}
.grade-comment{width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff;resize:vertical;min-height:60px}
.grade-comment:focus{outline:none;border-color:#7C3AED}
.grade-comment[readonly]{background:var(--slate-light);cursor:not-allowed}
.grade-result{font-size:13px;color:#4C1D95;font-weight:600;padding:8px 14px;background:#EDE9FE;border-radius:var(--radius-sm);display:flex;align-items:center;gap:6px}

/* SECTION CARD */
.section-card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.section-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:4px;height:18px;background:var(--blue);border-radius:2px;flex-shrink:0}
.section-code{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:500;color:var(--blue-light);background:var(--sky);padding:2px 7px;border-radius:4px}
.section-instruction{font-size:13px;color:var(--slate);margin-bottom:14px;padding:10px 14px;background:var(--amber-light);border-left:3px solid var(--amber);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-style:italic}

/* SOURCE BOX */
.source-box{background:var(--slate-light);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:14px;font-size:13.5px;line-height:1.7}
.source-label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--blue);text-transform:uppercase;margin-bottom:6px;font-family:"JetBrains Mono",monospace}

/* FORM */
.field-group{margin-bottom:14px}
.field-label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:5px}
.field-sublabel{font-size:12px;color:var(--slate);font-weight:400;margin-left:4px}
textarea,input[type="text"]{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:"Be Vietnam Pro",sans-serif;font-size:14px;color:var(--ink);background:#FAFCFF;transition:border-color .15s,background .15s;resize:vertical}
textarea:focus,input[type="text"]:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(27,79,216,.1)}
textarea{min-height:80px}
textarea.tall{min-height:120px}
textarea.short{min-height:52px}

/* TABLE */
.table-wrap{overflow-x:auto;margin-bottom:14px;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left;font-weight:600;font-size:12.5px;border-right:1px solid rgba(255,255,255,.12)}
thead th:last-child{border-right:none}
tbody tr:nth-child(even){background:var(--slate-light)}
tbody tr:nth-child(odd){background:#fff}
tbody td{padding:8px 10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);vertical-align:top}
tbody td:last-child{border-right:none}
tbody td.row-header{font-weight:600;color:var(--navy);background:var(--sky)!important;font-size:12.5px;min-width:130px}
tbody td textarea,tbody td input[type="text"]{min-height:50px;font-size:13px;background:transparent;border:1px solid #D0D9F0}
tbody td textarea:focus,tbody td input[type="text"]:focus{background:#fff}

/* CHECKBOX / RADIO */
.checkbox-list{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.checkbox-item{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.checkbox-item input[type="checkbox"]{width:18px;height:18px;margin-top:1px;flex-shrink:0;accent-color:var(--blue);cursor:pointer}
.checkbox-item span{font-size:14px;color:var(--ink)}
.rating-group{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.rating-option{display:flex;align-items:flex-start;gap:10px}
.rating-option input[type="radio"]{margin-top:3px;accent-color:var(--blue)}
.rating-option label{font-size:13.5px;cursor:pointer}
.rating-level{font-weight:600;color:var(--blue)}

/* INLINE FILL */
.inline-fill{display:inline-block;border:none;border-bottom:2px solid var(--blue-light);min-width:100px;padding:2px 6px;font-size:14px;font-family:"Be Vietnam Pro",sans-serif;color:var(--ink);background:var(--sky);outline:none}
.inline-fill:focus{border-bottom-color:var(--blue);background:#DBE7FF}

/* PORTFOLIO */
.portfolio-note{margin-top:14px;padding:12px 16px;background:var(--green-light);border-left:3px solid var(--green);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:13px;color:#065F46}
.portfolio-note strong{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.divider{border:none;border-top:1px solid var(--sky-deep);margin:18px 0}

/* LOADER */
#globalLoader{position:fixed;inset:0;background:rgba(15,43,91,.6);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;font-size:15px;font-weight:600}
#globalLoader .spinner{width:36px;height:36px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:var(--radius);font-size:14px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;box-shadow:var(--shadow-md)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.success{background:#065F46}
#toast.error{background:#991B1B}

/* PRINT */
@media print{
  .action-bar,.lesson-tabs-wrap,.hl-tabs-wrap{display:none!important}
  .hl-panel{display:block!important}
  .section-card{box-shadow:none!important;break-inside:avoid;border:1px solid #ccc}
  body{background:#fff;font-size:13px}
  .site-header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .content-area{padding:12px;max-width:100%}
}

@media(max-width:640px){
  .site-header,.action-bar,.student-bar,.lesson-tabs-wrap,.hl-tabs-wrap,.content-area{padding-left:14px;padding-right:14px}
  .student-bar{grid-template-columns:1fr 1fr}
  .header-title{font-size:18px}
}

/* LOGIN MODAL */
#loginOverlay{position:fixed;inset:0;background:rgba(15,43,91,.72);z-index:9998;display:flex;align-items:center;justify-content:center}
#loginOverlay.hidden{display:none}
.login-card{background:#fff;border-radius:16px;padding:36px 40px;width:380px;max-width:94vw;box-shadow:0 8px 40px rgba(15,43,91,.25);display:flex;flex-direction:column;gap:18px}
.login-title{font-size:20px;font-weight:700;color:var(--navy);text-align:center}
.login-sub{font-size:13px;color:var(--slate);text-align:center;margin-top:-10px}
.login-field{display:flex;flex-direction:column;gap:6px}
.login-field label{font-size:12px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.8px}
.login-field select,.login-field input{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--ink);background:#FAFCFF;transition:border-color .15s}
.login-field select:focus,.login-field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,79,216,.1)}
.btn-login{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s}
.btn-login:hover:not(:disabled){background:#1440B0}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-err{font-size:13px;color:var(--red);font-weight:600;text-align:center;min-height:20px}
.login-lock{font-size:13px;color:#92400E;font-weight:600;background:var(--amber-light);padding:8px 12px;border-radius:var(--radius-sm);text-align:center}
.session-bar{background:var(--green-light);border-bottom:1px solid #6EE7B7;padding:8px 32px;font-size:13px;color:#065F46;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.session-bar.hidden{display:none}
/* GV AUTH inside grading */
.gv-auth-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed #DDD6FE;margin-top:8px}
.gv-pw-input{padding:7px 12px;border:1.5px solid #DDD6FE;border-radius:var(--radius-sm);font-family:inherit;font-size:13px;width:160px;color:var(--ink)}
.gv-pw-input:focus{outline:none;border-color:#7C3AED}
.gv-auth-err{font-size:12px;color:var(--red);font-weight:600}
/* ROLE TOGGLE */
.role-toggle{display:flex;border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.role-btn{flex:1;padding:9px 0;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none;background:#F8FAFC;color:var(--slate);transition:all .15s;text-align:center}
.role-btn.active{background:var(--blue);color:#fff}
.role-btn.active.gv{background:#4C1D95}
/* LOGIN FIELD hidden */
.login-field.hidden{display:none}
/* TEACHER STUDENT BAR */
.teacher-bar{background:#EDE9FE;border-bottom:2px solid #DDD6FE;padding:10px 32px;display:none;gap:12px;align-items:center;flex-wrap:wrap}
.teacher-bar.visible{display:flex}
.teacher-bar label{font-size:11px;font-weight:700;color:#4C1D95;text-transform:uppercase;letter-spacing:.7px}
.teacher-bar select{padding:7px 12px;border:1.5px solid #DDD6FE;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--ink);background:#fff;cursor:pointer;min-width:130px}
.teacher-bar select:focus{outline:none;border-color:#7C3AED}
.teacher-name-display{font-size:14px;font-weight:700;color:#4C1D95}
/* session bar GV */
.session-bar.gv-mode{background:#EDE9FE;border-bottom-color:#DDD6FE;color:#4C1D95}
/* grading section: ẩn gv-auth-row khi đã đăng nhập với vai trò GV */
body.gv-logged .gv-auth-row{display:none!important}
body.gv-logged .btn-grade{display:inline-flex}
</style>
</head>
<body>


<!-- LOGIN MODAL -->
<div id="loginOverlay">
  <div class="login-card">
    <div class="login-title">🔐 Đăng nhập</div>
    <div class="login-sub">PROJECT X3 · PDP FSchools 2026–2027</div>

    <!-- Role toggle -->
    <div class="role-toggle">
      <button class="role-btn active" id="role_hs" onclick="setRole('hs')">🎓 Học sinh</button>
      <button class="role-btn gv" id="role_gv" onclick="setRole('gv')">👩‍🏫 Giáo viên</button>
    </div>

    <!-- HS: chọn tên -->
    <div class="login-field" id="field_hs_name">
      <label>Họ và tên</label>
      <select id="login_name">
        <option value="">-- Chọn tên --</option>
      </select>
    </div>

    <!-- GV: chọn tên GV -->
    <div class="login-field hidden" id="field_gv_name">
      <label>Tên giáo viên</label>
      <select id="login_gv_name">
        <option value="">-- Chọn GV --</option>
      </select>
    </div>

    <!-- Mật khẩu chung -->
    <div class="login-field">
      <label>Mật khẩu</label>
      <input type="password" id="login_pw" placeholder="Nhập mật khẩu..."
             onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>

    <div class="login-err" id="login_err"></div>
    <button class="btn-login" id="btn_login" onclick="doLogin()">Đăng nhập →</button>
  </div>
</div>

<!-- SESSION BAR -->
<div class="session-bar hidden" id="sessionBar">
  <span id="sessionLabel">👤 Đang đăng nhập...</span>
  <button class="btn btn-reset" style="padding:5px 12px;font-size:12px" onclick="doLogout()">🚪 Đăng xuất</button>
</div>

<!-- GLOBAL LOADER -->
<div id="globalLoader"><div class="spinner"></div><span id="loaderMsg">Đang tải...</span></div>

<!-- HEADER -->
<header class="site-header">
  <div class="header-eyebrow">PDP FSchools · Niên khóa 2026–2027</div>
  <div class="header-title">PROJECT X3 · TRUYỀN THÔNG SÁNG TẠO</div>
  <div class="header-subtitle">Bộ Học Liệu Tổng Hợp Toàn Khóa · Khối 11</div>
</header>

<!-- ACTION BAR -->
<div class="action-bar">
  <button class="btn btn-print" onclick="window.print()"><span class="btn-icon">🖨️</span> In</button>
  <button class="btn btn-email" onclick="sendEmail()"><span class="btn-icon">📧</span> Email</button>
  <div style="flex:1"></div>
  <span id="syncStatus" style="font-size:12px;color:var(--slate)"></span>
</div>

<!-- STUDENT BAR: HS mode = readonly, GV mode = ẩn -->
<div class="student-bar" id="studentBar" style="display:none">
  <div class="student-field">
    <label>Họ và tên</label>
    <input type="text" id="s_name" readonly style="background:var(--slate-light);font-weight:600"/>
  </div>
  <div class="student-field">
    <label>Lớp</label>
    <input type="text" id="s_lop" readonly style="background:var(--slate-light)"/>

// ═══════════════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', () => {
  buildAllPanels();
  switchLesson(0, document.querySelector('.lesson-tab'));
  initApp();
});

function buildAllPanels() {
  const ca = document.getElementById('contentArea');
  ca.innerHTML = '';
  LESSONS.forEach(lesson => {
    lesson.hls.forEach(hl => {
      const div = document.createElement('div');
      div.className = 'hl-panel';
      div.id = 'panel-' + hl.id;
      div.innerHTML = panelHeader(hl) + hlHTML(hl.id);
      ca.appendChild(div);
    });
  });
}

function panelHeader(hl) {
  const wrap = document.createElement('div');

  // ── Header row ──────────────────────────────────────────
  const header = document.createElement('div');
  header.className = 'hl-panel-header';

  const titleWrap = document.createElement('div');
  titleWrap.className = 'hl-panel-title-wrap';

  const badge = document.createElement('span');
  badge.className = 'hl-badge';
  badge.textContent = hl.id.replace('_', ' ');

  const titleDiv = document.createElement('div');

  const titleText = document.createElement('div');
  titleText.style.cssText = 'font-size:18px;font-weight:700;color:var(--navy)';
  titleText.textContent = hl.label;

  const statusBadge = document.createElement('div');
  statusBadge.id = 'status-' + hl.id;
  statusBadge.className = 'hl-status-badge unsaved';
  statusBadge.style.cssText = 'display:inline-block;margin-top:4px';
  statusBadge.textContent = '● Chưa lưu';

  titleDiv.appendChild(titleText);
  titleDiv.appendChild(statusBadge);
  titleWrap.appendChild(badge);
  titleWrap.appendChild(titleDiv);

  const actions = document.createElement('div');

function switchLesson(idx, btn) {
  currentLesson = idx;
  currentHLIndex = 0;
  document.querySelectorAll('.lesson-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderHLTabs();
  showHL(0);
}

function renderHLTabs() {
  const wrap = document.getElementById('hlTabsWrap');
  const lesson = LESSONS[currentLesson];
  wrap.innerHTML = '';
  lesson.hls.forEach((hl, i) => {
    const st = (hlState[hl.id] || {}).status || 'unsaved';
    const btn = document.createElement('button');
    btn.className = 'hl-tab ' + st + (i === 0 ? ' active' : '');
    btn.id = 'hltab-' + hl.id;
    btn.onclick = () => showHL(i);
    btn.innerHTML = '<span class="status-dot"></span>' + hl.label;
    wrap.appendChild(btn);
  });
}

function showHL(idx) {
  currentHLIndex = idx;
  // hide all
  document.querySelectorAll('.hl-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.hl-tab').forEach(t => t.classList.remove('active'));
  const lesson = LESSONS[currentLesson];
  const hl = lesson.hls[idx];
  document.getElementById('panel-' + hl.id)?.classList.add('active');
  document.getElementById('hltab-' + hl.id)?.classList.add('active');
}

// LOGIN / LOGOUT
// ═══════════════════════════════════════════════════════════
async function initApp() {
  const saved = sessionStorage.getItem(SESSION_KEY);
  if (saved) {
    try {
      const sess = JSON.parse(saved);
      if (sess.role === 'gv') {
        currentRole = 'gv';
        await enterAppGV(sess, false);
      } else {
        currentRole = 'hs';
        currentStudent = sess;
        await enterAppHS(sess, false);
      }
      return;
    } catch(e) { sessionStorage.removeItem(SESSION_KEY); }
  }
  await loadNameList();
  checkLockout();
}

async function loadNameList() {
  try {
    // ── Danh sách HS từ GAS ──────────────────────────────────────
    const res  = await fetch(GAS_URL + '?action=list');
    const json = await res.json();
    allStudents = json.students || [];
    const sel  = document.getElementById('login_name');
    sel.innerHTML = '<option value="">-- Chọn tên --</option>';
    allStudents.forEach(s => {
      const opt = document.createElement('option');
      opt.value = JSON.stringify({ ten: s.ten, lop: s.lop, nhom: s.nhom });
      opt.textContent = s.ten + (s.lop ? ' (' + s.lop + ')' : '');
      sel.appendChild(opt);
    });
    // ── Danh sách GV từ GAS ─────────────────────────────────────
    const res2  = await fetch(GAS_URL + '?action=listGV');
    const json2 = await res2.json();
    const sel2  = document.getElementById('login_gv_name');
    sel2.innerHTML = '<option value="">-- Chọn GV --</option>';
    (json2.teachers || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = JSON.stringify({ ten: t.ten, mon: t.mon || '' });
      opt.textContent = t.ten;
      sel2.appendChild(opt);
    });
  } catch(e) {
    document.getElementById('login_err').textContent = '❌ Không kết nối được server: ' + e.message;
  }
}

function checkLockout() {
  const lock = localStorage.getItem(LOCK_KEY);
  if (!lock) return false;
  const remaining = parseInt(lock) - Date.now();
  if (remaining > 0) {
    const mins = Math.ceil(remaining / 60000);
    const loginBtn = document.getElementById('btn_login');
    loginBtn.disabled = true;
    loginBtn.textContent = '🔒 Khóa ' + mins + ' phút nữa...';
    setTimeout(() => {
      localStorage.removeItem(LOCK_KEY);
      localStorage.removeItem(ATTEMPT_KEY);
      loginBtn.disabled = false;
      loginBtn.textContent = 'Đăng nhập →';
    }, remaining);
    return true;
  }
  localStorage.removeItem(LOCK_KEY);
  localStorage.removeItem(ATTEMPT_KEY);
  return false;
}

async function doLogin() {
  if (checkLockout()) return;
  const errEl = document.getElementById('login_err');
  const pw    = document.getElementById('login_pw').value.trim();
  const btn   = document.getElementById('btn_login');
  errEl.textContent = '';

  if (currentRole === 'hs') {
    // ── Học sinh ────────────────────────────────────────────
    const selVal = document.getElementById('login_name').value;
    if (!selVal) { errEl.textContent = 'Vui lòng chọn tên.'; return; }
    if (!pw)     { errEl.textContent = 'Vui lòng nhập mật khẩu.'; return; }
    let student;
    try { student = JSON.parse(selVal); } catch(e) { errEl.textContent = 'Lỗi dữ liệu.'; return; }

    btn.disabled = true; btn.textContent = 'Đang xác thực...';
    try {
      const res  = await fetch(GAS_URL + '?action=verify&name=' + encodeURIComponent(student.ten) + '&pw=' + encodeURIComponent(pw));
      const json = await res.json();
      if (json.valid) {
        localStorage.removeItem(LOCK_KEY); localStorage.removeItem(ATTEMPT_KEY);
        currentStudent = student;
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ ...student, role: 'hs' }));
        await enterAppHS(student, true);
      } else {
        const att = (parseInt(localStorage.getItem(ATTEMPT_KEY)) || 0) + 1;
        localStorage.setItem(ATTEMPT_KEY, att);
        if (att >= MAX_ATTEMPTS) {
          localStorage.setItem(LOCK_KEY, Date.now() + LOCK_MS);
          errEl.textContent = '🔒 Sai ' + MAX_ATTEMPTS + ' lần — khóa 5 phút.';
          checkLockout();
        } else {
          errEl.textContent = '❌ Mật khẩu không đúng. Còn ' + (MAX_ATTEMPTS - att) + ' lần thử.';
          btn.disabled = false; btn.textContent = 'Đăng nhập →';
        }
      }
    } catch(e) {
      errEl.textContent = '❌ Lỗi kết nối: ' + e.message;
      btn.disabled = false; btn.textContent = 'Đăng nhập →';
    }

  } else {
    // ── Giáo viên ───────────────────────────────────────────
    const selVal = document.getElementById('login_gv_name').value;
    if (!selVal) { errEl.textContent = 'Vui lòng chọn tên GV.'; return; }
    if (!pw)     { errEl.textContent = 'Vui lòng nhập mật khẩu.'; return; }
    let gv;
    try { gv = JSON.parse(selVal); } catch(e) { errEl.textContent = 'Lỗi dữ liệu.'; return; }

    btn.disabled = true; btn.textContent = 'Đang xác thực...';
    try {
      const res  = await fetch(GAS_URL + '?action=verifyGV&name=' + encodeURIComponent(gv.ten) + '&pw=' + encodeURIComponent(pw));
      const json = await res.json();
      if (json.valid) {
        localStorage.removeItem(LOCK_KEY); localStorage.removeItem(ATTEMPT_KEY);
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ ...gv, role: 'gv' }));
        await enterAppGV(gv, true);
      } else {
        const att = (parseInt(localStorage.getItem(ATTEMPT_KEY)) || 0) + 1;
        localStorage.setItem(ATTEMPT_KEY, att);
        if (att >= MAX_ATTEMPTS) {
          localStorage.setItem(LOCK_KEY, Date.now() + LOCK_MS);
          errEl.textContent = '🔒 Sai ' + MAX_ATTEMPTS + ' lần — khóa 5 phút.';
          checkLockout();
        } else {
          errEl.textContent = '❌ Mật khẩu GV không đúng. Còn ' + (MAX_ATTEMPTS - att) + ' lần thử.';
          btn.disabled = false; btn.textContent = 'Đăng nhập →';
        }
      }
    } catch(e) {
      errEl.textContent = '❌ Lỗi kết nối: ' + e.message;
      btn.disabled = false; btn.textContent = 'Đăng nhập →';
    }
  }
}

async function loadStudentData(ten, lop) {
  try {
    showLoader('Đang tải bài làm của ' + ten + '...');
    // Vẫn dùng GAS để đọc bài làm (GAS xử lý filter phức tạp)
    const res  = await fetch(GAS_URL + '?action=load&name=' + encodeURIComponent(ten) + '&lop=' + encodeURIComponent(lop), { });
    const json = await res.json();
    studentRecords = json.records || [];
    hlState = {};
    studentRecords.forEach(rec => {
      hlState[rec.hoc_lieu] = {
        status:        rec.trang_thai,
        data:          rec.du_lieu,
        submitted_at:  rec.submitted_at  || '',
        graded_at:     rec.graded_at     || '',
        grade_score:   rec.grade_score   || '',
        grade_comment: rec.grade_comment || ''
      };
      const isLocked = rec.trang_thai === 'submitted' || rec.trang_thai === 'graded';
      restorePanel(rec.hoc_lieu, rec.du_lieu, isLocked, rec);
    });
    renderHLTabs();
    showToast('✓ Đã tải bài làm của ' + ten, 'success');
  } catch(e) {
    showToast('❌ Lỗi tải dữ liệu: ' + e.message, 'error');
  } finally {
    hideLoader();
  }
}

// ═══════════════════════════════════════════════════════════
// RESTORE PANEL from saved data
// ═══════════════════════════════════════════════════════════
function restorePanel(hlId, data, locked, rec) {
  const panel = document.getElementById('panel-' + hlId);
  if (!panel || !data) return;

  // Fill inputs
  Object.entries(data).forEach(([fid, val]) => {
    const el = panel.querySelector(`[data-fid="${fid}"]`);
    if (!el) return;
    if (el.type === 'checkbox') el.checked = !!val;
    else if (el.type === 'radio') {
      // find radio with matching value
      panel.querySelectorAll(`[data-fid="${fid}"]`).forEach(r => {
        if (r.value === val) r.checked = true;
      });
    }
    else el.value = val || '';
  });

  // Lock if submitted/graded
  if (locked) lockPanel(hlId);

  // Restore grading if present
  if (rec) restoreGrading(hlId, rec);

  // Update status badge
  const stKey = hlState[hlId]?.status || (locked ? 'submitted' : 'draft');
  const timeStr = stKey === 'graded' ? (hlState[hlId]?.graded_at||'') : (hlState[hlId]?.submitted_at||'');
  updateStatusBadge(hlId, stKey, timeStr);
}

function lockPanel(hlId) {
  const panel = document.getElementById('panel-' + hlId);
  if (!panel) return;
  panel.classList.add('locked');
  // Hide save/submit buttons
  panel.querySelectorAll('.btn-save, .btn-submit').forEach(b => {
    b.disabled = true;
    b.style.opacity = '.4';
    b.style.cursor = 'not-allowed';
  });
  // Add locked banner if not already there
  if (!panel.querySelector('.locked-banner')) {
    const banner = document.createElement('div');
    banner.className = 'locked-banner';
    const submittedTime = hlState[hlId]?.submitted_at || '';
    banner.innerHTML = '🔒 Đã nộp' + (submittedTime ? ' lúc ' + submittedTime : '') + ' — không thể chỉnh sửa';
    panel.querySelector('.hl-panel-header').insertAdjacentElement('afterend', banner);
  }
}

function updateStatusBadge(hlId, status, time) {
  const badge = document.getElementById('status-' + hlId);
  if (!badge) return;
  const labels = { draft:'● Đã lưu (nháp)', submitted:'✓ Đã nộp', graded:'★ Đã chấm', unsaved:'● Chưa lưu' };
  badge.className = 'hl-status-badge ' + status;
  let badgeText = labels[status] || status;
  if (status === 'submitted' && time) badgeText = '✓ Đã nộp lúc ' + time;
  if (status === 'graded' && time) badgeText = '★ Đã chấm: ' + time;
  badge.textContent = badgeText;

  // Update HL tab dot
  const tab = document.getElementById('hltab-' + hlId);
  if (tab) {
    tab.className = tab.className.replace(/(draft|submitted|graded|unsaved)/g,'').trim() + ' ' + status;
  }

  hlState[hlId] = hlState[hlId] || {};
  hlState[hlId].status = status;
}

// ═══════════════════════════════════════════════════════════
// COLLECT PANEL DATA
// ═══════════════════════════════════════════════════════════
function collectPanel(hlId) {
  const panel = document.getElementById('panel-' + hlId);
  if (!panel) return {};
  const data = {};
  // textareas / text inputs
  panel.querySelectorAll('[data-fid]').forEach(el => {
    const fid = el.dataset.fid;
    if (!fid) return;
    if (el.type === 'checkbox') data[fid] = el.checked;
    else if (el.type === 'radio') { if (el.checked) data[fid] = el.value; }
    else data[fid] = el.value;
  });
  return data;
}

// ═══════════════════════════════════════════════════════════
// SAVE / SUBMIT
// ═══════════════════════════════════════════════════════════
function getStudent() {
  if (currentStudent) return currentStudent;
  return {
    ten:  document.getElementById('s_name').value,
    lop:  document.getElementById('s_lop').value,
    nhom: document.getElementById('s_nhom').value,
  };
}

async function saveHL(hlId) {
  const st = getStudent();
  if (!st.ten) { showToast('Vui lòng chọn tên học sinh trước!', 'error'); return; }
  const lesson = LESSONS.find(l => l.hls.some(h => h.id === hlId));
  const data = collectPanel(hlId);

  if (!GAS_URL || GAS_URL.includes('YOUR_')) {
    // Offline mode — just update state
    hlState[hlId] = { status:'draft', data };
    updateStatusBadge(hlId, 'draft');
    showToast('💾 Đã lưu (offline — chưa kết nối Sheet)', 'success');
    return;
  }

  try {
    showLoader('Đang lưu...');
    const res = await fetch(GAS_URL, { method: 'POST',
      body: JSON.stringify({
        action:'save',
        ten: st.ten, lop: st.lop, nhom: st.nhom,
        bai: lesson?.bai, hoc_lieu: hlId,
        du_lieu: data, ua: navigator.userAgent
      })
    });
    const json = await res.json();
    if (json.ok) {
      hlState[hlId] = { status:'draft', data };
      updateStatusBadge(hlId, 'draft');
      showToast('💾 Đã lưu vào Google Sheet!', 'success');
    } else {
      showToast('❌ ' + (json.error || 'Lỗi lưu'), 'error');
    }
  } catch(e) {
    showToast('❌ Lỗi kết nối: ' + e.message, 'error');
  } finally {
    hideLoader();
  }
}

async function submitHL(hlId) {
  const st = getStudent();
  if (!st.ten) { showToast('Vui lòng chọn tên học sinh trước!', 'error'); return; }
  if (!confirm('Bạn có chắc muốn NỘP BÀI "' + hlId + '" không?\nSau khi nộp, bài sẽ bị KHÓA và không thể sửa.')) return;
  const lesson = LESSONS.find(l => l.hls.some(h => h.id === hlId));
  const data = collectPanel(hlId);

  if (!GAS_URL || GAS_URL.includes('YOUR_')) {
    const _now = new Date().toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'});
    hlState[hlId] = { status:'submitted', data, submitted_at: _now };
    updateStatusBadge(hlId, 'submitted', _now);
    lockPanel(hlId);
    showToast('✅ Đã nộp bài (offline)', 'success');
    return;
  }

  try {
    showLoader('Đang nộp bài...');
    const res = await fetch(GAS_URL, { method: 'POST',
      body: JSON.stringify({
        action:'submit',
        ten: st.ten, lop: st.lop, nhom: st.nhom,
        bai: lesson?.bai, hoc_lieu: hlId,
        du_lieu: data, ua: navigator.userAgent
      })
    });
    const json = await res.json();
    if (json.ok) {
      const _ts = json.submitted_at || new Date().toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'});
      hlState[hlId] = { status:'submitted', data, submitted_at: _ts };
      updateStatusBadge(hlId, 'submitted', _ts);
      lockPanel(hlId);
      showToast('✅ Nộp bài thành công!', 'success');
    } else {
      showToast('❌ ' + (json.error || 'Lỗi nộp'), 'error');
    }
  } catch(e) {
    showToast('❌ Lỗi kết nối: ' + e.message, 'error');
  } finally {
    hideLoader();
  }
}

// ═══════════════════════════════════════════════════════════
// RESET current HL
// ═══════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
// RESTORE GRADING (fill score + comment from saved data)
// ═══════════════════════════════════════════════════════════
function restoreGrading(hlId, rec) {
  const scoreEl   = document.getElementById('grade-score-' + hlId);
  const commentEl = document.getElementById('grade-comment-' + hlId);
  const resultEl  = document.getElementById('grade-result-' + hlId);
  if (!scoreEl) return;

  if (rec.grade_score !== '' && rec.grade_score !== undefined) {
    scoreEl.value = rec.grade_score;
    scoreEl.readOnly = true;
  }
  if (rec.grade_comment) {
    commentEl.value = rec.grade_comment;
    commentEl.readOnly = true;
  }
  if (rec.trang_thai === 'graded' && rec.grade_score !== '') {
    resultEl.style.display = 'flex';
    resultEl.textContent = '★ ' + rec.grade_score + '/10 — Chấm lúc ' + (rec.graded_at || '');
    // Lock grade button
    const gradeBtn = scoreEl.closest('.grading-section')?.querySelector('.btn-grade');
    if (gradeBtn) { gradeBtn.disabled = true; gradeBtn.textContent = '✔ Đã chấm'; }
  }
}

// ═══════════════════════════════════════════════════════════
// GRADE HL — Giáo viên chấm điểm
// ═══════════════════════════════════════════════════════════
async function gradeHL(hlId) {
  const scoreEl   = document.getElementById('grade-score-' + hlId);
  const commentEl = document.getElementById('grade-comment-' + hlId);
  const resultEl  = document.getElementById('grade-result-' + hlId);
  const gvPwEl    = document.getElementById('gv-pw-' + hlId);
  const gvErrEl   = document.getElementById('gv-err-' + hlId);

  const score = parseFloat(scoreEl?.value);
  const gvPw  = gvPwEl?.value?.trim() || '';

  if (!gvPw) {
    if (gvErrEl) gvErrEl.textContent = '⚠ Nhập mã GV trước!';
    return;
  }
  if (isNaN(score) || score < 0 || score > 10) {
    showToast('❌ Điểm số phải từ 0 đến 10!', 'error'); return;
  }
  if (!confirm('Xác nhận chấm điểm ' + score + '/10 cho học liệu "' + hlId + '"?\nSau khi chấm sẽ không thể thay đổi.')) return;
  if (gvErrEl) gvErrEl.textContent = '';

  const st = getStudent();
  if (!st.ten) { showToast('Chưa chọn học sinh!', 'error'); return; }
  const lesson = LESSONS.find(l => l.hls.some(h => h.id === hlId));
  const now = new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });

  if (!GAS_URL || GAS_URL.includes('YOUR_')) {
    // Offline
    scoreEl.readOnly = true;
    commentEl.readOnly = true;
    resultEl.style.display = 'flex';
    resultEl.textContent = '★ ' + score + '/10 — Chấm lúc ' + now;
    const gradeBtn = scoreEl.closest('.grading-section')?.querySelector('.btn-grade');
    if (gradeBtn) { gradeBtn.disabled = true; gradeBtn.textContent = '✔ Đã chấm'; }
    hlState[hlId] = { ...(hlState[hlId]||{}), status:'graded', graded_at: now, grade_score: score };
    updateStatusBadge(hlId, 'graded', score + '/10 lúc ' + now);
    showToast('★ Đã chấm điểm (offline)', 'success');
    return;
  }

  try {
    showLoader('Đang lưu điểm...');
    const res = await fetch(GAS_URL, { method: 'POST',
      body: JSON.stringify({
        action: 'grade',
        ten: st.ten, lop: st.lop,
        bai: lesson?.bai, hoc_lieu: hlId,
        grade_score: score,
        grade_comment: commentEl?.value || '',
        gv_pw: gvPw,
        ua: navigator.userAgent
      })
    });
    const json = await res.json();
    if (json.ok) {
      const ts = json.graded_at || now;
      scoreEl.readOnly = true;
      commentEl.readOnly = true;
      resultEl.style.display = 'flex';
      resultEl.textContent = '★ ' + score + '/10 — Chấm lúc ' + ts;
      const gradeBtn = scoreEl.closest('.grading-section')?.querySelector('.btn-grade');
      if (gradeBtn) { gradeBtn.disabled = true; gradeBtn.textContent = '✔ Đã chấm'; }
      hlState[hlId] = { ...(hlState[hlId]||{}), status:'graded', graded_at: ts, grade_score: score };
      updateStatusBadge(hlId, 'graded', score + '/10 lúc ' + ts);
      showToast('★ Đã chấm điểm thành công!', 'success');
    } else {
      const errMsg = json.error || 'Lỗi chấm điểm';
      if (gvErrEl && errMsg.includes('GV')) gvErrEl.textContent = '❌ ' + errMsg;
      else showToast('❌ ' + errMsg, 'error');
    }
  } catch(e) {
    showToast('❌ Lỗi kết nối: ' + e.message, 'error');
  } finally {
    hideLoader();
  }
}

function resetCurrent() {
  const lesson = LESSONS[currentLesson];
  const hl = lesson.hls[currentHLIndex];
  const panel = document.getElementById('panel-' + hl.id);
  if (!panel) return;
  if (panel.classList.contains('locked')) { showToast('Bài đã nộp — không thể xóa trắng!', 'error'); return; }
  if (!confirm('⚠ Xóa trắng toàn bộ nội dung đã điền trong:\n"' + hl.label + '"\n\nHành động này không thể hoàn tác. Tiếp tục?')) return;
  panel.querySelectorAll('textarea, input[type="text"]').forEach(e => e.value='');
  panel.querySelectorAll('input[type="checkbox"]').forEach(e => e.checked=false);
  panel.querySelectorAll('input[type="radio"]').forEach(e => e.checked=false);
  updateStatusBadge(hl.id, 'unsaved');
  showToast('🔄 Đã reset học liệu này');
}

// ═══════════════════════════════════════════════════════════
// EMAIL
// ═══════════════════════════════════════════════════════════
function sendEmail() {
  const st = getStudent();
  const lesson = LESSONS[currentLesson];
  const hl = lesson.hls[currentHLIndex];
  const data = collectPanel(hl.id);
  const lines = ['PROJECT X3 — Bài làm: ' + hl.id, 'Họ tên: ' + st.ten, 'Lớp: ' + st.lop, '---'];
  Object.entries(data).forEach(([k,v]) => { if(v) lines.push('[' + k + ']: ' + v); });
  const body = encodeURIComponent(lines.join('\n').substring(0,2000));
  window.location.href = 'mailto:?subject=' + encodeURIComponent('PROJECT X3 - ' + hl.id + ' - ' + st.ten) + '&body=' + body;
}

// ═══════════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════════
function showLoader(msg) {
  document.getElementById('loaderMsg').textContent = msg || 'Đang tải...';
  document.getElementById('globalLoader').style.display = 'flex';
}
function hideLoader() {
  document.getElementById('globalLoader').style.display = 'none';
}
function setSyncStatus(msg) {
  document.getElementById('syncStatus').textContent = msg;
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.className = '', 3000);
}
</script>
